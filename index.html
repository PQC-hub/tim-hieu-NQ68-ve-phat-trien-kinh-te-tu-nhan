<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tìm hiểu về phát triển kinh tế tư nhân theo Nghị quyết 68-NQ/TW</title>
<meta name="description" content="Bộ câu hỏi trắc nghiệm tìm hiểu về phát triển kinh tế tư nhân theo Nghị quyết 68-NQ/TW của Bộ Chính trị. Biên soạn: Phạm Quang Chinh.">

<style>

--ok:#157A47;--ok-bg:#E2F5EA;--bad:#C0281F;--bad-bg:#FDE9E7;--blue:#2F6FDE;--band:#0F2F63;--cream:#CFE0FA;--shadow:0 6px 24px rgba(21,32,46,.08)}

--ok:#5FD39A;--ok-bg:#123626;--bad:#FF8A80;--bad-bg:#40191A;--blue:#8DB8FF;--band:#0A1E3F;--cream:#CFE0FA;--shadow:0 6px 24px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0D1420;--card:#162131;--card2:#1C2A3D;--line:#2B3B52;--ink:#EAF0F8;--muted:#9DB0C6;
--red:#4F88E6;--red-h:#3C74D2;--red-bg:#16294A;--gold:#F5C547;--gold-h:#E2B23A;--gold-ink:#2B1F00;--gold-bg:#3A3010;--gold-tx:#F5D77A;
--ok:#5FD39A;--ok-bg:#123626;--bad:#FF8A80;--bad-bg:#40191A;--blue:#8DB8FF;--band:#0A1E3F;--cream:#CFE0FA;--shadow:0 6px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.5;font-size:16px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.banner{position:relative;background:var(--band)}
.banner img{display:block;width:100%;height:max(23.6vw,min(42vh,33.7vw));object-fit:cover;object-position:top}
.credit{background:var(--band);color:var(--cream);text-align:center;padding:10px max(16px,env(safe-area-inset-left));font-size:13px;line-height:1.45;letter-spacing:.02em;border-top:3px solid var(--gold)}
.credit b{color:#fff;font-weight:700}
.credit span{display:block}
@media(min-width:760px){.credit span{display:inline}.credit span+span:before{content:"  ·  "}}
.tbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:18px;box-shadow:var(--shadow)}
.banner .tbtn.snd{right:calc(max(10px,env(safe-area-inset-right)) + 48px)}
.banner .tbtn{position:absolute;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));background:rgba(255,255,255,.85);color:#222;border-color:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px}
.hero{margin-top:-1px;padding:26px 0 8px}
h1{font-size:clamp(22px,4.6vw,34px);line-height:1.2;margin:0 0 6px;color:var(--red);letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 18px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:18px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;border-left:4px solid var(--gold)}
.stat b{display:block;font-size:26px;line-height:1.1;color:var(--red)}
.stat small{color:var(--muted)}
.modes{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-bottom:16px}
@media(min-width:700px){.modes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mode{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;display:block;width:100%}
.mode.on{border-color:var(--red);background:var(--red-bg)}
.mode h3{margin:0 0 4px;font-size:17px}
.mode p{margin:0;color:var(--muted);font-size:14px}
.go{display:block;width:100%;background:var(--gold);color:var(--gold-ink);border:0;border-radius:14px;padding:15px 20px;font-size:18px;font-weight:800;box-shadow:0 6px 0 var(--gold-h);transition:transform .08s,box-shadow .08s}
.go:hover{background:var(--gold-h)}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 var(--gold-h)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;font-weight:600}
.btn:hover{border-color:var(--red);color:var(--red)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:var(--red-h);color:#fff}
.btn[disabled]{opacity:.45;cursor:default}
.best{margin:12px 0 0;text-align:center;color:var(--muted);font-size:14px}
details{margin-top:16px}
summary{cursor:pointer;font-weight:700;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.refs{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.refs li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
.refs b{color:var(--red)}
.ladder{margin:22px 0 40px}
.ladder h2,.sec-t{font-size:18px;margin:0 0 10px}
.lad{display:grid;gap:8px}
.lad div{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
.lad b{min-width:84px;color:var(--red)}
.lad em{font-style:normal;color:var(--muted)}
/* quiz */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0;padding-top:max(10px,env(safe-area-inset-top))}
.bar .wrap{display:flex;align-items:center;gap:10px}
.bar .mid{flex:1;min-width:0}
.bar .t1{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));border-radius:99px;transition:width .3s}
.qlay{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding:18px 0 24px}
@media(min-width:900px){.qlay{grid-template-columns:minmax(0,1fr) 280px;align-items:start}.side{position:sticky;top:76px}}
.qtags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.tag.red{background:var(--red-bg);color:var(--red);border-color:transparent}
.qtext{font-size:clamp(17px,2.4vw,20px);font-weight:700;line-height:1.4;margin:0 0 14px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--red)}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.opt .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--red);background:var(--red-bg)}
.opt.sel .k{background:var(--red);color:#fff;border-color:var(--red)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt[disabled]{cursor:default}
.exp{margin-top:14px;border-radius:14px;padding:14px 16px;border:1px solid var(--line);background:var(--card2);font-size:15px}
.exp.ok{background:var(--ok-bg);border-color:var(--ok)}
.exp.bad{background:var(--bad-bg);border-color:var(--bad)}
.exp h4{margin:0 0 6px;font-size:15px}.exp p{margin:0 0 8px;line-height:1.6}.exp p:last-child{margin-bottom:0}.exp p.why{opacity:.82;font-size:14px;border-top:1px dashed var(--line);padding-top:8px;margin-top:10px}
.exp.ok h4{color:var(--ok)}.exp.bad h4{color:var(--bad)}
.tip{margin-top:10px;background:var(--gold-bg);color:var(--gold-tx);border-left:5px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:15px}
.tip b{letter-spacing:.06em;font-size:12px;display:block;margin-bottom:2px}
.nav{position:sticky;bottom:0;z-index:15;background:var(--bg);border-top:1px solid var(--line);padding:10px 0;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.nav .wrap{display:flex;gap:10px}
.nav .btn{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.gn{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px;padding:0;position:relative}
.gn.cur{outline:3px solid var(--gold)}
.gn.done{background:var(--red);border-color:var(--red);color:#fff}
.gn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.gn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.gn.fl:after{content:"⚑";position:absolute;top:-6px;right:-3px;font-size:13px;color:var(--gold)}
.legend{font-size:12px;color:var(--muted);margin-top:10px}
.flagb{font-size:13px;padding:6px 12px;border-radius:99px}
.flagb.on{background:var(--gold-bg);border-color:var(--gold);color:var(--gold-tx)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.ov .card{max-width:420px;width:100%}
.ov h3{margin:0 0 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.row .btn{flex:1}
/* result */
.rtop{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:center;text-align:center}
@media(min-width:760px){.rtop{grid-template-columns:200px minmax(0,1fr);text-align:left}}
.ring{position:relative;width:180px;height:180px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{fill:none;stroke:var(--line);stroke-width:12}
.ring .fg{fill:none;stroke:var(--red);stroke-width:12;stroke-linecap:round;stroke-dasharray:326.7;stroke-dashoffset:326.7;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:40px;line-height:1;color:var(--red)}
.ring .num small{color:var(--muted)}
.gb{display:inline-block;background:var(--gold);color:var(--gold-ink);font-weight:800;border-radius:99px;padding:4px 16px;font-size:18px;margin-bottom:6px}
.rstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}
@media(min-width:700px){.rstats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.rs{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.rs b{display:block;font-size:24px}
.rs.ok b{color:var(--ok)}.rs.bad b{color:var(--bad)}
.rs small{color:var(--muted)}
.comments{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin:0 0 16px}
.comments p{margin:0;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:15px}
.meters{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.meter-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;margin-bottom:4px}
.meter-top span{color:var(--muted)}
.mbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:99px;width:0;transition:width .9s ease}
.l-hi i{background:var(--ok)}.l-mid i{background:var(--gold)}.l-lo i{background:var(--bad)}
.recall{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin:0;padding:0;list-style:none}
.recall li{background:var(--gold-bg);color:var(--gold-tx);border-left:5px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:14px}
.sec{margin-top:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border-radius:99px;padding:6px 14px;font-size:14px;border:1px solid var(--line);background:var(--card)}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.rv{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.rv .card{padding:16px}
.rv .opt{cursor:default;padding:8px 12px}
.rv .opt:hover{border-color:var(--line)}
.rv .opt.ok:hover{border-color:var(--ok)}.rv .opt.bad:hover{border-color:var(--bad)}
.acts{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin:18px 0 40px}
@media(min-width:700px){.acts{grid-template-columns:repeat(3,minmax(0,1fr))}}
.btn.sm{padding:8px 14px;font-size:14px}
.privacy{margin:10px 0 0;text-align:center;color:var(--muted);font-size:13px}
.bigstat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
@media(min-width:700px){.bigstat{grid-template-columns:repeat(3,minmax(0,1fr))}}
.hq{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.hq li{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
.hq b{color:var(--red)}
.hb{background:linear-gradient(160deg,#0F2F63,#1B4A9C);padding:56px 16px 34px;text-align:center;color:#fff}.hbi strong{display:block;font-size:clamp(26px,5.6vw,46px);font-weight:800;line-height:1.15;margin:0 auto 10px;max-width:820px;letter-spacing:-.01em}.hbi em{display:block;font-style:normal;color:#CFE0FA;font-size:clamp(15px,2.4vw,18px)}
.exp a,.refs a{color:var(--blue);font-weight:600}
.tag.lnk{text-decoration:none;cursor:pointer;border-color:var(--blue);color:var(--blue)}.tag.red.lnk{background:var(--red-bg);color:var(--red);border-color:transparent}.tag.lnk:hover{text-decoration:underline}
.note{padding:14px 16px;background:var(--gold-bg);color:var(--gold-tx);border-radius:12px;margin:20px 0;font-size:15px}
#boot{padding:24px;margin:24px auto;max-width:560px;background:var(--gold-bg);color:var(--gold-tx);border-radius:12px;font-size:15px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

50%","Khoảng 60-65%"],"e":"Ở phần đánh giá thực trạng, Nghị quyết cho biết hiện nay kinh tế tư nhân đóng góp khoảng 50% GDP và hơn 30% tổng thu ngân sách nhà nước.\nMục II.1 đặt mục tiêu đến năm 2030 nâng mức đóng góp lên khoảng 35-40% tổng thu ngân sách, song song với khoảng 55-58% GDP. Nên nhớ hai chỉ tiêu này cùng nhau để không nhầm giữa GDP và ngân sách.\nVì sao các phương án còn lại chưa đúng: Mức 20-25% thấp hơn cả hiện trạng (hơn 30%). Mức 45-50% và 60-65% cao hơn mục tiêu; 45-50% còn dễ nhầm với mức đóng góp GDP hiện nay (khoảng 50%).","t":""},{"s":"A","y":"NH","r":"NQ 68-NQ/TW · Mục I, quan điểm 1","q":"Nghị quyết 68-NQ/TW xác định kinh tế tư nhân là gì?","o":["Một động lực quan trọng nhất của nền kinh tế quốc gia","Thành phần kinh tế bổ trợ cho kinh tế nhà nước","Khu vực chỉ hoạt động ở các ngành nghề nhỏ lẻ","Lực lượng duy nhất quyết định tăng trưởng"],"e":"Quan điểm chỉ đạo thứ nhất (mục I) khẳng định kinh tế tư nhân là một động lực quan trọng nhất của nền kinh tế quốc gia, là lực lượng đi đầu trong tăng trưởng, tạo việc làm, nâng cao năng suất và năng lực cạnh tranh.\nNhư vậy kinh tế tư nhân không được nhìn như khu vực chỉ \"bổ trợ\" hay gắn với ngành nghề nhỏ lẻ; đồng thời văn bản đặt khu vực này bên cạnh kinh tế nhà nước và kinh tế tập thể.\nVì sao các phương án còn lại chưa đúng: Nghị quyết không coi kinh tế tư nhân chỉ là bổ trợ hay nhỏ lẻ. Văn bản cũng không nói đây là lực lượng \"duy nhất\" quyết định tăng trưởng, vì kinh tế tư nhân hoạt động cùng kinh tế nhà nước và kinh tế tập thể.","t":""},{"s":"A","y":"NH","r":"NQ 68-NQ/TW · Mục I, quan điểm 1","q":"Cùng với kinh tế nhà nước và kinh tế tập thể, kinh tế tư nhân giữ vai trò gì trong xây dựng nền kinh tế độc lập, tự chủ, tự lực, tự cường?","o":["Vai trò nòng cốt","Vai trò bổ trợ","Vai trò thứ yếu","Vai trò thay thế"],"e":"Cũng ở quan điểm 1: cùng với kinh tế nhà nước và kinh tế tập thể, kinh tế tư nhân giữ vai trò nòng cốt trong xây dựng nền kinh tế độc lập, tự chủ, gắn với hội nhập quốc tế sâu rộng, giúp đất nước thoát khỏi nguy cơ tụt hậu và vươn lên thịnh vượng.\nCần phân biệt: \"động lực quan trọng nhất\" nói về sức đẩy tăng trưởng; \"nòng cốt\" nói về vị trí trong cấu trúc nền kinh tế cùng với hai khu vực còn lại.\nVì sao các phương án còn lại chưa đúng: \"Bổ trợ\", \"thứ yếu\" và \"thay thế\" đều không có trong văn bản. Nghị quyết đặt ba thành phần kinh tế cạnh nhau, không để thành phần nào thay thế thành phần nào.","t":""},{"s":"A","y":"NH","r":"NQ 68-NQ/TW · Mục I, quan điểm 3","q":"Nghị quyết 68-NQ/TW xác định doanh nhân là gì?","o":["Người chiến sĩ trên mặt trận kinh tế","Người làm thuê cho Nhà nước","Đối tác phụ trợ của doanh nghiệp nhà nước","Lực lượng hỗ trợ khi nền kinh tế khó khăn"],"e":"Quan điểm 3 yêu cầu xoá bỏ triệt để định kiến, tôn trọng doanh nghiệp, doanh nhân và coi doanh nhân là \"chiến sĩ trên mặt trận kinh tế\". Cách gọi này đi cùng yêu cầu bảo đảm quyền sở hữu tài sản, quyền tự do kinh doanh và quyền cạnh tranh bình đẳng.\nQuan điểm 5 bổ sung: cần chú trọng đào tạo đội ngũ doanh nhân có đạo đức, văn hoá kinh doanh, bản lĩnh, trí tuệ, yêu nước và thượng tôn pháp luật.\nVì sao các phương án còn lại chưa đúng: \"Người làm thuê cho Nhà nước\", \"đối tác phụ trợ\" hay \"lực lượng hỗ trợ khi khó khăn\" đều đặt doanh nhân ở vai trò phụ, trái với tinh thần tôn vinh của Nghị quyết.","t":""},{"s":"A","y":"NH","r":"NQ 68-NQ/TW · Mục I, quan điểm 5","q":"Theo quan điểm chỉ đạo, trong phát triển kinh tế tư nhân, Đảng lãnh đạo, Nhà nước kiến tạo và lấy đối tượng nào là trung tâm, là chủ thể?","o":["Doanh nghiệp","Cơ quan quản lý nhà nước","Doanh nghiệp nhà nước","Các hiệp hội ngành hàng"],"e":"Quan điểm 5: tăng cường vai trò lãnh đạo của Đảng và vai trò kiến tạo của Nhà nước, lấy doanh nghiệp làm trung tâm, là chủ thể.\nNghĩa là Nhà nước tạo môi trường thể chế và phục vụ, còn doanh nghiệp là bên trực tiếp quyết định, thực hiện hoạt động sản xuất, kinh doanh. Có thể nhớ theo bộ ba: Đảng lãnh đạo, Nhà nước kiến tạo, doanh nghiệp là trung tâm.\nVì sao các phương án còn lại chưa đúng: Cơ quan quản lý nhà nước và hiệp hội ngành hàng là bên hỗ trợ, kiến tạo. Doanh nghiệp nhà nước là một thành phần kinh tế khác, không phải đối tượng được lấy làm \"trung tâm, chủ thể\" trong phát triển kinh tế tư nhân.","t":""},{"s":"A","y":"NH","r":"NQ 68-NQ/TW · Mục III.1","q":"Nhiệm vụ, giải pháp đầu tiên trong 8 nhóm nhiệm vụ, giải pháp của Nghị quyết 68-NQ/TW là gì?","o":["Đổi mới tư duy, thống nhất cao về nhận thức và hành động, khơi dậy niềm tin, khát vọng dân tộc","Tăng cường nguồn lực tài chính và đất đai cho doanh nghiệp","Đẩy mạnh xuất khẩu và thu hút đầu tư nước ngoài","Xây dựng đội ngũ công chức chuyên nghiệp, hiện đại"],"e":"Mục III có 8 nhóm nhiệm vụ, giải pháp. Nhóm đầu tiên (III.1) là đổi mới tư duy, thống nhất cao về nhận thức và hành động, khơi dậy niềm tin, khát vọng dân tộc, tạo xung lực mới, khí thế mới.\nNội dung gồm: thống nhất nhận thức ở mọi cấp; Nhà nước giữ vai trò kiến tạo, phục vụ, hỗ trợ; đẩy mạnh truyền thông và nghiêm cấm thông tin sai lệch gây ảnh hưởng đến doanh nghiệp. Điều này khớp với phần đánh giá thực trạng, nơi \"nhận thức chưa đầy đủ\" được nêu đầu tiên trong các nguyên nhân.\nVì sao các phương án còn lại chưa đúng: Đất đai và vốn nằm ở nhóm III.3, đứng sau. Xuất khẩu chỉ xuất hiện ở các nhóm sau (như chương trình Go Global ở III.6). Xây dựng đội ngũ công chức không phải một nhóm riêng; nhóm III.8 nói về đạo đức kinh doanh, trách nhiệm xã hội và vai trò doanh nhân.","t":""},{"s":"A","y":"NH","r":"NQ 68-NQ/TW · Mục II.1","q":"Mục tiêu đến năm 2030, phấn đấu có bao nhiêu doanh nghiệp hoạt động trong nền kinh tế?","o":["2 triệu doanh nghiệp (20 doanh nghiệp/nghìn dân)","1 triệu doanh nghiệp","1,5 triệu doanh nghiệp","3 triệu doanh nghiệp"],"e":"Mục II.1 đặt mục tiêu đến năm 2030 phấn đấu có 2 triệu doanh nghiệp hoạt động, tương đương 20 doanh nghiệp trên 1.000 dân, trong đó có ít nhất 20 doanh nghiệp lớn tham gia chuỗi giá trị toàn cầu.\nSo với hiện nay (khoảng hơn 940 nghìn doanh nghiệp và hơn 5 triệu hộ kinh doanh theo phần đánh giá thực trạng), đây là mục tiêu tăng hơn gấp đôi số doanh nghiệp. Mốc 2045 là ít nhất 3 triệu doanh nghiệp.\nVì sao các phương án còn lại chưa đúng: 1 triệu và 1,5 triệu thấp hơn mục tiêu. 3 triệu là mục tiêu của tầm nhìn 2045, không phải của năm 2030.","t":""},{"s":"A","y":"NH","r":"NQ 68-NQ/TW · Mục II.2","q":"Tầm nhìn đến năm 2045, Nghị quyết đặt mục tiêu như thế nào?","o":["Ít nhất 3 triệu doanh nghiệp; kinh tế tư nhân đóng góp khoảng trên 60% GDP","Ít nhất 2 triệu doanh nghiệp; đóng góp khoảng 50% GDP","Ít nhất 3 triệu doanh nghiệp; đóng góp khoảng 55-58% GDP","Ít nhất 4 triệu doanh nghiệp; đóng góp khoảng 70% GDP"],"e":"Mục II.2 (tầm nhìn đến năm 2045): kinh tế tư nhân phát triển nhanh, mạnh, bền vững, chủ động tham gia chuỗi sản xuất và cung ứng toàn cầu; phấn đấu có ít nhất 3 triệu doanh nghiệp, đóng góp khoảng trên 60% GDP.\nNên đặt ba mốc cạnh nhau: GDP hiện nay khoảng 50%; năm 2030 khoảng 55-58%; năm 2045 trên 60%.\nVì sao các phương án còn lại chưa đúng: \"2 triệu doanh nghiệp\" là mục tiêu 2030 và \"50% GDP\" là mức đóng góp hiện nay. \"55-58% GDP\" là mục tiêu 2030. \"4 triệu doanh nghiệp, 70% GDP\" không có trong Nghị quyết.","t":""},{"s":"A","y":"NH","r":"NQ 68-NQ/TW · Mục II.1","q":"Đến năm 2030, kinh tế tư nhân phấn đấu đóng góp khoảng bao nhiêu % GDP?","o":["Khoảng 55-58% GDP","Khoảng 45-50% GDP","Khoảng 50-52% GDP","Trên 60% GDP"],"e":"Mục II.1: đến năm 2030 kinh tế tư nhân phấn đấu đóng góp khoảng 55-58% GDP và khoảng 35-40% tổng thu ngân sách, tăng trưởng bình quân khoảng 10-12%/năm, cao hơn tốc độ tăng trưởng chung của nền kinh tế.\nHiện nay mức đóng góp khoảng 50% GDP, nghĩa là mục tiêu tăng thêm khoảng 5-8 điểm phần trăm.\nVì sao các phương án còn lại chưa đúng: 45-50% và 50-52% thấp hơn hoặc gần với mức hiện nay. \"Trên 60%\" là mục tiêu của tầm nhìn 2045, không phải của năm 2030.","t":""},{"s":"A","y":"NH","r":"NQ 68-NQ/TW · Mục II.1","q":"Đến năm 2030, tốc độ tăng trưởng bình quân của kinh tế tư nhân phấn đấu đạt khoảng bao nhiêu?","o":["Khoảng 10-12%/năm","Khoảng 6-8%/năm","Khoảng 8-10%/năm","Khoảng 12-15%/năm"],"e":"Mục II.1: tốc độ tăng trưởng bình quân của kinh tế tư nhân phấn đấu khoảng 10-12%/năm, cao hơn tốc độ tăng trưởng chung của nền kinh tế.\nChỉ tiêu này đi cùng năng suất lao động tăng bình quân khoảng 8,5-9,5%/năm và tạo việc làm cho khoảng 84-85% tổng số lao động.\nVì sao các phương án còn lại chưa đúng: 6-8% và 8-10% thấp hơn chỉ tiêu; 12-15%/năm cao hơn khoảng được nêu trong văn bản.","t":""},{"s":"A","y":"NH","r":"NQ 68-NQ/TW · Phần mở đầu (đánh giá thực trạng)","q":"Theo phần đánh giá thực trạng, khu vực kinh tế tư nhân hiện sử dụng khoảng bao nhiêu % tổng số lao động?","o":["Khoảng 82%","Khoảng 50%","Khoảng 65%","Khoảng 95%"],"e":"Phần đánh giá thực trạng cho biết kinh tế tư nhân hiện có khoảng hơn 940 nghìn doanh nghiệp và hơn 5 triệu hộ kinh doanh, đóng góp khoảng 50% GDP, hơn 30% tổng thu ngân sách và sử dụng khoảng 82% tổng số lao động.\nĐến năm 2030 (mục II.1), Nghị quyết đặt mục tiêu tạo việc làm cho khoảng 84-85% tổng số lao động. Cần phân biệt số liệu hiện trạng (82%) với mục tiêu (84-85%).\nVì sao các phương án còn lại chưa đúng: 50% là mức đóng góp GDP hiện nay, không phải tỷ lệ lao động. 65% và 95% không phải số liệu trong văn bản.","t":""},{"s":"A","y":"NH","r":"NQ 68-NQ/TW · Mục II.1","q":"Đến năm 2030, có ít nhất bao nhiêu doanh nghiệp lớn của Việt Nam tham gia chuỗi giá trị toàn cầu?","o":["Ít nhất 20 doanh nghiệp","Ít nhất 10 doanh nghiệp","Ít nhất 50 doanh nghiệp","Ít nhất 100 doanh nghiệp"],"e":"Mục II.1 nêu mục tiêu đến năm 2030 có ít nhất 20 doanh nghiệp lớn tham gia chuỗi giá trị toàn cầu, bên cạnh mục tiêu 2 triệu doanh nghiệp hoạt động.\nỞ mục III.6, Nghị quyết còn đề ra Chương trình phát triển 1.000 doanh nghiệp tiêu biểu và Chương trình vươn ra thị trường quốc tế (Go Global) để hình thành doanh nghiệp lớn, tập đoàn tư nhân tầm khu vực, toàn cầu.\nVì sao các phương án còn lại chưa đúng: Các con số 10, 50, 100 không phải chỉ tiêu trong văn bản. Đừng nhầm 20 doanh nghiệp lớn với 1.000 doanh nghiệp tiêu biểu hay 10.000 giám đốc điều hành.","t":""},{"s":"A","y":"NH","r":"NQ 68-NQ/TW · Mục II.1","q":"Mục tiêu 2030 về trình độ, năng lực công nghệ, đổi mới sáng tạo, chuyển đổi số của kinh tế tư nhân là gì?","o":["Thuộc nhóm 3 nước đứng đầu ASEAN và nhóm 5 nước đứng đầu khu vực châu Á","Thuộc nhóm 5 nước đứng đầu ASEAN và nhóm 10 nước đứng đầu châu Á","Thuộc nhóm 3 nước đứng đầu châu Á","Thuộc nhóm 10 nước đứng đầu thế giới"],"e":"Mục II.1: đến năm 2030, trình độ, năng lực công nghệ, đổi mới sáng tạo và chuyển đổi số của kinh tế tư nhân thuộc nhóm 3 nước đứng đầu ASEAN và nhóm 5 nước đứng đầu khu vực châu Á.\nĐừng nhầm với mục tiêu về môi trường đầu tư kinh doanh (mục III.2.1, đến năm 2028): nhóm 3 quốc gia hàng đầu ASEAN và nhóm 30 quốc gia hàng đầu thế giới.\nVì sao các phương án còn lại chưa đúng: \"Nhóm 5 ASEAN và 10 châu Á\" thấp hơn mục tiêu. \"Nhóm 3 đứng đầu châu Á\" và \"nhóm 10 đứng đầu thế giới\" không được nêu trong văn bản.","t":""},{"s":"A","y":"NH","r":"NQ 68-NQ/TW · Mục III.2.1","q":"Quyền kinh doanh chỉ có thể bị hạn chế vì các lý do quốc phòng, an ninh quốc gia, trật tự, an toàn xã hội, đạo đức xã hội, môi trường, sức khoẻ cộng đồng và phải được quy định trong văn bản nào?","o":["Luật","Thông tư của bộ, ngành","Nghị định của Chính phủ","Quyết định của Ủy ban nhân dân"],"e":"Mục III.2.1: người dân, doanh nghiệp được tự do kinh doanh trong những ngành nghề mà pháp luật không cấm. Quyền kinh doanh chỉ bị hạn chế vì lý do quốc phòng, an ninh quốc gia, trật tự, an toàn xã hội, đạo đức xã hội, môi trường, sức khoẻ cộng đồng, và việc hạn chế đó phải được quy định trong luật.\nTheo tinh thần này, việc hạn chế quyền kinh doanh cần có căn cứ ở cấp luật, không phải ở văn bản dưới luật.\nVì sao các phương án còn lại chưa đúng: Thông tư, nghị định và quyết định của Ủy ban nhân dân đều là văn bản dưới luật, nên không phải hình thức mà Nghị quyết yêu cầu cho việc hạn chế quyền kinh doanh.","t":""},{"s":"A","y":"NH","r":"NQ 68-NQ/TW · Mục III.2.1","q":"Nghị quyết yêu cầu giảm thiểu, xoá bỏ cơ chế và tư duy nào sau đây?","o":["Cơ chế \"xin - cho\" và tư duy \"không quản được thì cấm\"","Nguyên tắc hậu kiểm","Cơ chế thị trường","Công khai, minh bạch trong thủ tục hành chính"],"e":"Mục III.2.1 yêu cầu vận hành nền kinh tế theo cơ chế thị trường định hướng xã hội chủ nghĩa, giảm can thiệp hành chính, xoá bỏ cơ chế \"xin - cho\" và tư duy \"không quản được thì cấm\".\nCơ chế \"xin - cho\" khiến doanh nghiệp phụ thuộc vào sự chấp thuận của cơ quan quản lý; tư duy \"không quản được thì cấm\" dễ dẫn đến hạn chế quyền kinh doanh thay vì tìm cách quản lý hiệu quả hơn.\nVì sao các phương án còn lại chưa đúng: Hậu kiểm, cơ chế thị trường và công khai, minh bạch thủ tục đều là hướng mà Nghị quyết khuyến khích, không phải thứ cần xoá bỏ.","t":""},{"s":"A","y":"NH","r":"NQ 68-NQ/TW · Mục III.2.1","q":"Nghị quyết yêu cầu chuyển mạnh phương thức quản lý như thế nào?","o":["Từ tiền kiểm sang hậu kiểm, gắn với tăng cường kiểm tra, giám sát","Từ hậu kiểm sang tiền kiểm","Từ công bố điều kiện kinh doanh sang cấp phép đối với mọi lĩnh vực","Từ thanh tra từ xa sang thanh tra trực tiếp"],"e":"Mục III.2.1: chuyển từ quản lý sang phục vụ, kiến tạo; quản trị công dựa trên dữ liệu; chuyển từ tiền kiểm sang hậu kiểm, đồng thời tăng cường kiểm tra, giám sát. Thay cho cấp phép là công bố điều kiện kinh doanh và hậu kiểm, trừ một số ít lĩnh vực theo quy định và thông lệ quốc tế.\nHậu kiểm không có nghĩa là buông lỏng: doanh nghiệp bớt thủ tục trước khi kinh doanh, nhưng việc kiểm tra, giám sát sau đó được tăng cường.\nVì sao các phương án còn lại chưa đúng: Chiều ngược lại (\"từ hậu kiểm sang tiền kiểm\", \"cấp phép đối với mọi lĩnh vực\") là điều Nghị quyết muốn thay đổi. Về thanh tra, mục III.2.2 còn ưu tiên thanh tra từ xa, trực tuyến dựa trên dữ liệu điện tử và giảm thanh tra trực tiếp, nên phương án \"từ xa sang trực tiếp\" cũng ngược tinh thần.","t":""},{"s":"A","y":"NH","r":"NQ 68-NQ/TW · Mục III.4","q":"Nghị quyết 68-NQ/TW yêu cầu triển khai quyết liệt Nghị quyết số 57-NQ/TW ngày 22/12/2024 của Bộ Chính trị về nội dung nào?","o":["Đột phá phát triển khoa học, công nghệ, đổi mới sáng tạo và chuyển đổi số quốc gia","Đổi mới công tác xây dựng và thi hành pháp luật","Hội nhập quốc tế trong tình hình mới","Phát triển kinh tế nhà nước"],"e":"Mục III.4 yêu cầu triển khai quyết liệt Nghị quyết số 57-NQ/TW ngày 22/12/2024 của Bộ Chính trị về đột phá phát triển khoa học, công nghệ, đổi mới sáng tạo và chuyển đổi số, trong khu vực kinh tế tư nhân. Mục II.1 cũng nêu kinh tế tư nhân là lực lượng tiên phong về khoa học công nghệ, đổi mới sáng tạo và chuyển đổi số.\nCác chính sách đi kèm gồm: khung pháp lý thử nghiệm có kiểm soát (sandbox), tính 200% chi phí R&D vào chi phí được trừ, quỹ phát triển khoa học công nghệ tối đa 20% thu nhập tính thuế.\nVì sao các phương án còn lại chưa đúng: Xây dựng và thi hành pháp luật, hội nhập quốc tế, kinh tế nhà nước là chủ đề của các nghị quyết khác, không phải của Nghị quyết 57-NQ/TW.","t":""},{"s":"A","y":"NH","r":"NQ 68-NQ/TW · Mục III.2.1","q":"Phấn đấu đến năm 2028, môi trường đầu tư kinh doanh của Việt Nam thuộc nhóm nào?","o":["Nhóm 3 quốc gia hàng đầu ASEAN và nhóm 30 quốc gia hàng đầu thế giới","Nhóm 5 quốc gia hàng đầu ASEAN","Nhóm 10 quốc gia hàng đầu châu Á","Nhóm 50 quốc gia hàng đầu thế giới"],"e":"Mục III.2.1: phấn đấu đến năm 2028 môi trường đầu tư kinh doanh của Việt Nam thuộc nhóm 3 quốc gia hàng đầu ASEAN và nhóm 30 quốc gia hàng đầu thế giới.\nTrong cùng mục còn có chỉ tiêu năm 2025: cắt giảm ít nhất 30% thời gian xử lý thủ tục hành chính, 30% chi phí tuân thủ và 30% điều kiện kinh doanh. Có thể nhớ theo trục thời gian: 2025 cắt giảm thủ tục; 2028 môi trường kinh doanh; 2030 các chỉ tiêu tăng trưởng; 2045 tầm nhìn.\nVì sao các phương án còn lại chưa đúng: Các nhóm \"5 quốc gia ASEAN\", \"10 châu Á\", \"50 thế giới\" không phải mục tiêu được nêu. Nhóm 3 ASEAN và 5 châu Á là chỉ tiêu 2030 về công nghệ, đổi mới sáng tạo, chuyển đổi số, đừng nhầm với mốc 2028.","t":""},{"s":"A","y":"NH","r":"NQ 68-NQ/TW · Mục I, quan điểm 3","q":"Nghị quyết 68-NQ/TW yêu cầu xoá bỏ triệt để nhận thức, tư tưởng, quan niệm, thái độ nào đối với kinh tế tư nhân Việt Nam?","o":["Định kiến về kinh tế tư nhân","Tâm lý ngại hội nhập kinh tế quốc tế","Tư tưởng ưu tiên tuyệt đối cho doanh nghiệp lớn","Thái độ cạnh tranh thiếu lành mạnh giữa các doanh nghiệp"],"e":"Quan điểm 3 yêu cầu xoá bỏ triệt để định kiến về kinh tế tư nhân Việt Nam, đánh giá đúng vai trò của khu vực này; đồng thời tôn trọng doanh nghiệp, doanh nhân, bảo đảm quyền sở hữu tài sản, quyền tự do kinh doanh và quyền cạnh tranh bình đẳng.\nPhần đánh giá thực trạng cũng nêu nhận thức về vị trí, vai trò của kinh tế tư nhân chưa đầy đủ là một nguyên nhân chủ yếu của các hạn chế hiện nay.\nVì sao các phương án còn lại chưa đúng: Ngại hội nhập, ưu tiên doanh nghiệp lớn hay cạnh tranh thiếu lành mạnh không phải điều mà quan điểm 3 nêu cần xoá bỏ; văn bản nêu rõ là \"định kiến\".","t":""},{"s":"B","y":"NH","r":"NQ 68-NQ/TW · Mục III.2.1","q":"Theo Nghị quyết, chính sách đặc biệt hỗ trợ doanh nghiệp nhỏ và vừa gồm nội dung nào?","o":["Bãi bỏ lệ phí môn bài; miễn thuế thu nhập doanh nghiệp trong 3 năm đầu thành lập","Giảm 50% thuế thu nhập doanh nghiệp trong 5 năm đầu","Miễn thuế giá trị gia tăng trong 3 năm đầu","Miễn toàn bộ các loại thuế trong 10 năm đầu"],"e":"Mục III.2.1 nêu cơ chế đặc biệt hỗ trợ doanh nghiệp nhỏ và vừa: bãi bỏ lệ phí môn bài và miễn thuế thu nhập doanh nghiệp trong 3 năm đầu kể từ khi thành lập; bố trí ngân sách trung ương, địa phương kết hợp các quỹ từ doanh nghiệp, hiệp hội, viện nghiên cứu, trường đại học.\nĐây là định hướng chính sách của Đảng; mức cụ thể do luật, nghị quyết của Quốc hội và các văn bản của Chính phủ quy định.\nVì sao các phương án còn lại chưa đúng: Giảm 50% thuế trong 5 năm, miễn thuế giá trị gia tăng 3 năm hay miễn toàn bộ các loại thuế 10 năm đều không có trong văn bản. Nghị quyết nêu thuế thu nhập doanh nghiệp, không phải thuế giá trị gia tăng.","t":"Mức cụ thể do luật, nghị quyết của Quốc hội quy định; Nghị quyết nêu chủ trương, định hướng."},{"s":"B","y":"NH","r":"NQ 68-NQ/TW · Mục III.2.2","q":"Về thanh tra, kiểm tra doanh nghiệp, Nghị quyết bảo đảm nguyên tắc nào?","o":["Chỉ thanh tra, kiểm tra mỗi năm 1 lần, trừ trường hợp có bằng chứng rõ ràng về vi phạm","Thanh tra, kiểm tra tối đa 2 lần mỗi năm","Thanh tra, kiểm tra theo từng quý","Không giới hạn số lần thanh tra, kiểm tra"],"e":"Mục III.2.2: chấm dứt thanh tra, kiểm tra chồng chéo, trùng lắp, kéo dài; mỗi doanh nghiệp chỉ được thanh tra, kiểm tra mỗi năm 1 lần, trừ trường hợp có bằng chứng rõ ràng về vi phạm.\nCùng mục này còn có: xử lý nghiêm việc lạm dụng thanh tra để nhũng nhiễu; ưu tiên thanh tra từ xa dựa trên dữ liệu điện tử; miễn kiểm tra thực tế với doanh nghiệp tuân thủ tốt.\nVì sao các phương án còn lại chưa đúng: \"Tối đa 2 lần\", \"theo quý\" hay \"không giới hạn\" đều khác quy định 1 lần mỗi năm. Ngoại lệ chỉ áp dụng khi có bằng chứng rõ ràng về vi phạm.","t":""},{"s":"B","y":"NH","r":"NQ 68-NQ/TW · Mục III.2.1","q":"Nghị quyết yêu cầu cắt giảm ít nhất bao nhiêu % thời gian xử lý thủ tục hành chính, chi phí tuân thủ pháp luật và điều kiện kinh doanh?","o":["Ít nhất 30% đối với mỗi nội dung","Ít nhất 10%","Ít nhất 20%","Ít nhất 50%"],"e":"Mục III.2.1: trong năm 2025, rà soát, loại bỏ điều kiện kinh doanh không cần thiết, quy định chồng chéo và cắt giảm ít nhất 30% thời gian xử lý thủ tục hành chính, ít nhất 30% chi phí tuân thủ pháp luật và ít nhất 30% điều kiện kinh doanh; các năm sau tiếp tục cắt giảm mạnh.\nCon số 30% áp dụng cho từng nội dung, không phải mức chung cho cả ba nội dung cộng lại.\nVì sao các phương án còn lại chưa đúng: 10% và 20% thấp hơn mức yêu cầu; 50% cao hơn mức nêu trong văn bản.","t":""},{"s":"B","y":"NH","r":"NQ 68-NQ/TW · Mục III.7","q":"Hình thức thuế khoán đối với hộ kinh doanh được yêu cầu xoá bỏ chậm nhất vào thời điểm nào?","o":["Trong năm 2026","Trong năm 2025","Trong năm 2027","Trong năm 2030"],"e":"Mục III.7 (hỗ trợ doanh nghiệp nhỏ, siêu nhỏ và hộ kinh doanh) yêu cầu xoá bỏ thuế khoán đối với hộ kinh doanh chậm nhất trong năm 2026, đồng thời số hoá, đơn giản hoá kế toán, thuế, bảo hiểm; cung cấp miễn phí nền tảng số, phần mềm kế toán dùng chung, tư vấn pháp lý và đào tạo.\nMục tiêu là thu hẹp chênh lệch về quản trị, chế độ tài chính - kế toán để khuyến khích hộ kinh doanh chuyển thành doanh nghiệp.\nVì sao các phương án còn lại chưa đúng: Văn bản ghi mốc cụ thể là năm 2026 (\"chậm nhất\"), không ghi 2025. Năm 2027 và 2030 là quá hạn so với mốc đó.","t":""},{"s":"B","y":"NH","r":"NQ 68-NQ/TW · Mục III.4","q":"Về nghiên cứu và phát triển (R&D), Nghị quyết cho phép doanh nghiệp tính vào chi phí khi xác định thu nhập chịu thuế bằng bao nhiêu?","o":["200% chi phí thực tế của hoạt động nghiên cứu và phát triển","100% chi phí thực tế","150% chi phí thực tế","300% chi phí thực tế"],"e":"Mục III.4: cho phép doanh nghiệp tính vào chi phí khi xác định thu nhập chịu thuế đối với hoạt động nghiên cứu và phát triển (R&D) ở mức 200% chi phí thực tế. Nói cách khác, chi 100 đồng cho R&D thì được tính 200 đồng vào chi phí được trừ.\nNgoài ra, Nghị quyết hỗ trợ chi phí mua máy móc, đổi mới công nghệ, chuyển đổi số, chuyển đổi xanh thông qua khấu trừ thuế thu nhập doanh nghiệp hoặc tài trợ qua quỹ.\nVì sao các phương án còn lại chưa đúng: 100% chỉ là chi phí thực tế thông thường, chưa có ưu đãi. 150% và 300% không phải mức nêu trong văn bản.","t":" R&D là hoạt động nghiên cứu, phát triển để tạo ra hoặc cải tiến sản phẩm, công nghệ, quy trình mới."},{"s":"B","y":"NH","r":"NQ 68-NQ/TW · Mục III.4","q":"Doanh nghiệp được trích tối đa bao nhiêu % thu nhập tính thuế thu nhập doanh nghiệp để lập quỹ phát triển khoa học, công nghệ, đổi mới sáng tạo, chuyển đổi số và nghiên cứu phát triển?","o":["Tối đa 20%","Tối đa 5%","Tối đa 10%","Tối đa 50%"],"e":"Mục III.4: doanh nghiệp được trích tối đa 20% thu nhập tính thuế thu nhập doanh nghiệp để lập quỹ phát triển khoa học, công nghệ, đổi mới sáng tạo, chuyển đổi số và R&D. Quỹ có thể dùng để tự thực hiện hoặc đặt hàng nghiên cứu bên ngoài theo cơ chế khoán sản phẩm.\nLưu ý chữ \"tối đa\": 20% là mức trần chứ không phải mức bắt buộc.\nVì sao các phương án còn lại chưa đúng: 5% và 10% thấp hơn mức trần; 50% cao hơn rất nhiều so với mức nêu. Đừng nhầm với 200% chi phí R&D ở câu trước.","t":""},{"s":"B","y":"NH","r":"NQ 68-NQ/TW · Mục III.3.1","q":"Nhà nước có chính sách giảm tối thiểu bao nhiêu % tiền thuê lại đất trong 5 năm đầu đối với doanh nghiệp công nghệ cao, doanh nghiệp nhỏ và vừa, doanh nghiệp khởi nghiệp sáng tạo trong khu, cụm công nghiệp?","o":["Tối thiểu 30%","Tối thiểu 5%","Tối thiểu 10%","Tối thiểu 70%"],"e":"Mục III.3.1: Nhà nước giảm tối thiểu 30% tiền thuê lại đất trong 5 năm đầu kể từ khi ký hợp đồng đối với doanh nghiệp công nghệ cao, doanh nghiệp nhỏ và vừa, doanh nghiệp khởi nghiệp sáng tạo trong khu, cụm công nghiệp; khoản giảm được khấu trừ vào tiền thuê đất mà chủ đầu tư hạ tầng phải nộp.\nChính sách này nhằm giảm chi phí mặt bằng cho nhóm doanh nghiệp công nghệ cao, nhỏ và vừa, khởi nghiệp sáng tạo đang cần vốn để phát triển.\nVì sao các phương án còn lại chưa đúng: Các mức 5%, 10% và 70% đều khác với mức giảm tối thiểu 30% nêu trong văn bản.","t":""},{"s":"B","y":"NH","r":"NQ 68-NQ/TW · Mục III.3.3","q":"Nghị quyết đề ra chương trình đào tạo, bồi dưỡng đội ngũ doanh nhân với quy mô bao nhiêu giám đốc điều hành?","o":["10.000 giám đốc điều hành","1.000 giám đốc điều hành","5.000 giám đốc điều hành","100.000 giám đốc điều hành"],"e":"Mục III.3.3 (nhân lực chất lượng cao) đề ra triển khai chương trình đào tạo, bồi dưỡng 10.000 giám đốc điều hành, kết hợp huy động doanh nhân thành đạt chia sẻ kinh nghiệm.\nCùng mục có: chi phí đào tạo và đào tạo lại nhân lực của doanh nghiệp được tính vào chi phí được trừ khi xác định thu nhập chịu thuế; thúc đẩy giáo dục sáng tạo, STEM, ngoại ngữ và kỹ năng số ở mọi bậc học.\nVì sao các phương án còn lại chưa đúng: 1.000, 5.000 và 100.000 không phải quy mô của chương trình. Đừng nhầm với \"1.000 doanh nghiệp tiêu biểu\" ở mục III.6.","t":""},{"s":"B","y":"NH","r":"NQ 68-NQ/TW · Mục III.2.2","q":"Về thực thi hợp đồng, Nghị quyết yêu cầu chấm dứt tình trạng nào?","o":["Cơ quan nhà nước, doanh nghiệp nhà nước chậm thực hiện nghĩa vụ thanh toán theo hợp đồng đã ký với doanh nghiệp tư nhân","Doanh nghiệp tư nhân đề nghị thanh toán trước thời hạn","Doanh nghiệp tư nhân tham gia đấu thầu các dự án công","Doanh nghiệp tư nhân hợp tác với doanh nghiệp FDI"],"e":"Mục III.2.2 (bảo đảm quyền sở hữu, quyền tự do kinh doanh và thực thi hợp đồng) yêu cầu chấm dứt tình trạng cơ quan nhà nước, doanh nghiệp nhà nước chậm thanh toán hợp đồng đã ký với doanh nghiệp tư nhân; đồng thời có cơ chế đặc thù cho các dự án, hợp đồng tồn đọng nhiều năm và xác định trách nhiệm cơ quan, cá nhân liên quan.\nNghị quyết còn yêu cầu hoàn thiện pháp luật về thực thi hợp đồng, rút ngắn thời gian giải quyết tranh chấp thương mại.\nVì sao các phương án còn lại chưa đúng: Doanh nghiệp tư nhân đề nghị thanh toán trước hạn, tham gia đấu thầu dự án công hay hợp tác với FDI không phải \"tình trạng\" cần chấm dứt. Nghị quyết còn mở rộng sự tham gia của doanh nghiệp tư nhân vào dự án quốc gia (III.6) và khuyến khích liên kết (III.5).","t":""},{"s":"B","y":"NH","r":"NQ 68-NQ/TW · Mục III.8","q":"Theo Nghị quyết, tiêu chí nào sau đây KHÔNG thuộc 4 tiêu chí cốt lõi để đánh giá doanh nghiệp tư nhân theo chuẩn quốc tế?","o":["Quy mô vốn điều lệ","Mức độ tuân thủ pháp luật","Giải quyết công ăn việc làm","Tham gia các hoạt động an sinh xã hội"],"e":"Mục III.8: đánh giá doanh nghiệp tư nhân theo chuẩn quốc tế dựa trên 4 tiêu chí: (1) tuân thủ pháp luật; (2) tạo việc làm; (3) đóng góp ngân sách nhà nước; (4) tham gia an sinh xã hội.\nQuy định vốn điều lệ không nằm trong bốn tiêu chí này; có thể hiểu cách đánh giá hướng vào mức tuân thủ và đóng góp thực tế hơn là quy mô vốn.\nVì sao các phương án còn lại chưa đúng: Ba phương án còn lại đều trùng với tiêu chí trong văn bản (tuân thủ pháp luật, tạo việc làm, an sinh xã hội). Tiêu chí thứ tư là đóng góp ngân sách nhà nước.","t":"4 tiêu chí cốt lõi: tuân thủ pháp luật; giải quyết việc làm; đóng góp ngân sách nhà nước; tham gia an sinh xã hội."},{"s":"C","y":"NH","r":"NQ 68-NQ/TW · Mục III.1","q":"Về vai trò của Nhà nước đối với kinh tế tư nhân, Nghị quyết xác định như thế nào?","o":["Nhà nước kiến tạo, phục vụ, hỗ trợ; không can thiệp hành chính vào hoạt động sản xuất, kinh doanh trái với nguyên tắc thị trường","Nhà nước trực tiếp điều hành hoạt động sản xuất, kinh doanh của doanh nghiệp","Nhà nước chỉ quản lý, không có trách nhiệm hỗ trợ","Nhà nước ưu tiên doanh nghiệp nhà nước trong mọi trường hợp"],"e":"Mục III.1: Nhà nước giữ vai trò kiến tạo, phục vụ, hỗ trợ kinh tế tư nhân phát triển nhanh và bền vững; không can thiệp hành chính vào sản xuất, kinh doanh trái nguyên tắc thị trường. Quan hệ giữa chính quyền và doanh nghiệp được định hướng là cởi mở, thân thiện, đồng hành, liêm chính và phục vụ phát triển.\nVới cán bộ cơ sở, \"kiến tạo, phục vụ\" nghĩa là hướng dẫn, tháo gỡ vướng mắc cho doanh nghiệp, không phải điều hành thay hay gây thêm khó khăn.\nVì sao các phương án còn lại chưa đúng: Trực tiếp điều hành là can thiệp hành chính. \"Chỉ quản lý, không hỗ trợ\" bỏ qua vai trò phục vụ, hỗ trợ. \"Ưu tiên doanh nghiệp nhà nước trong mọi trường hợp\" trái nguyên tắc không phân biệt đối xử giữa các thành phần kinh tế (mục III.2.1).","t":""},{"s":"C","y":"NH","r":"NQ 68-NQ/TW · Mục III.2.1","q":"Cơ chế miễn trừ trách nhiệm đối với cán bộ, công chức được áp dụng trong trường hợp nào?","o":["Đã thực hiện đầy đủ quy trình, quy định, không tư lợi, nhưng có thiệt hại do rủi ro khách quan","Có thiệt hại xảy ra, bất kể có tư lợi hay không","Thực hiện không đúng quy trình nhưng không bị phát hiện","Chỉ khi có chỉ đạo bằng miệng của cấp trên"],"e":"Mục III.2.1: cán bộ, công chức đã thực hiện đầy đủ quy trình, quy định, không vì lợi ích cá nhân nhưng vẫn xảy ra thiệt hại do rủi ro khách quan thì được miễn trừ trách nhiệm.\nCơ chế này nhằm gỡ tâm lý e ngại, sợ sai, đùn đẩy trong giải quyết công việc cho doanh nghiệp. Ba điều kiện đi cùng nhau: làm đúng quy trình, không tư lợi, thiệt hại do rủi ro khách quan. Thiếu một trong ba thì không được miễn trừ.\nVì sao các phương án còn lại chưa đúng: Có tư lợi, làm sai quy trình hay làm theo chỉ đạo miệng đều không thuộc diện được miễn trừ. Cùng mục này, Nghị quyết còn yêu cầu xử lý nghiêm hành vi tham nhũng, trục lợi, nhũng nhiễu.","t":""},{"s":"C","y":"NH","r":"NQ 68-NQ/TW · Mục III.2.3","q":"Khi xử lý sai phạm về dân sự, kinh tế, Nghị quyết yêu cầu ưu tiên áp dụng biện pháp nào trước?","o":["Các biện pháp dân sự, kinh tế, hành chính","Các biện pháp hình sự","Kê biên, phong toả toàn bộ tài sản của doanh nghiệp","Đình chỉ ngay hoạt động của doanh nghiệp"],"e":"Mục III.2.3: ưu tiên áp dụng các biện pháp dân sự, kinh tế, hành chính trước; hạn chế tối đa việc dùng biện pháp hình sự đối với các vi phạm mang tính chất kinh tế, dân sự.\nTinh thần là phân biệt rõ vi phạm kinh tế, dân sự với tội phạm hình sự, để tránh \"hình sự hoá\" quan hệ kinh tế làm doanh nghiệp đình trệ.\nVì sao các phương án còn lại chưa đúng: Xử lý hình sự trước, kê biên toàn bộ tài sản hay đình chỉ ngay hoạt động đều ngược với nguyên tắc ưu tiên biện pháp dân sự, kinh tế, hành chính và quy định về tính tương xứng của biện pháp cưỡng chế.","t":""},{"s":"C","y":"NH","r":"NQ 68-NQ/TW · Mục III.2.3","q":"Nguyên tắc nào sau đây được nêu trong Nghị quyết khi xử lý vi phạm liên quan đến doanh nghiệp, doanh nhân?","o":["Không hồi tố các quy định pháp luật để xử lý bất lợi cho doanh nghiệp; bảo đảm nguyên tắc suy đoán vô tội","Áp dụng hồi tố khi cần thiết để xử lý nghiêm","Xử lý hình sự trước, khắc phục hậu quả kinh tế sau","Kết luận kéo dài để chờ bổ sung chứng cứ"],"e":"Mục III.2.3: không hồi tố quy định pháp luật để xử lý bất lợi cho doanh nghiệp; bảo đảm nguyên tắc suy đoán vô tội; không để việc xử lý kéo dài làm gián đoạn hoạt động sản xuất, kinh doanh.\nSuy đoán vô tội nghĩa là một người chưa bị coi là có tội cho đến khi có kết luận hợp pháp của cơ quan có thẩm quyền.\nVì sao các phương án còn lại chưa đúng: Hồi tố bất lợi, xử lý hình sự trước hay kết luận kéo dài đều đi ngược các nguyên tắc nêu trong mục III.2.3.","t":""},{"s":"C","y":"NH","r":"NQ 68-NQ/TW · Mục III.2.2","q":"Đối với doanh nghiệp nào, Nghị quyết yêu cầu miễn kiểm tra thực tế?","o":["Doanh nghiệp tuân thủ tốt quy định pháp luật","Doanh nghiệp có quy mô lớn","Doanh nghiệp mới thành lập","Doanh nghiệp có vốn đầu tư nước ngoài"],"e":"Mục III.2.2: doanh nghiệp tuân thủ tốt quy định pháp luật được miễn kiểm tra thực tế; cùng mục này còn có nguyên tắc mỗi năm thanh tra, kiểm tra doanh nghiệp tối đa 1 lần trừ khi có bằng chứng rõ ràng về vi phạm, và ưu tiên thanh tra từ xa.\nĐây là cách khuyến khích tuân thủ: doanh nghiệp làm đúng thì được giảm gánh nặng kiểm tra.\nVì sao các phương án còn lại chưa đúng: Quy mô lớn, mới thành lập hay có vốn nước ngoài không phải tiêu chí được miễn kiểm tra thực tế; tiêu chí là mức độ tuân thủ pháp luật.","t":""},{"s":"C","y":"NH","r":"NQ 68-NQ/TW · Mục III.2.1","q":"Về cung cấp dịch vụ công cho doanh nghiệp, Nghị quyết yêu cầu triển khai mạnh mẽ theo hướng nào?","o":["Không phụ thuộc vào địa giới hành chính","Chỉ thực hiện tại nơi doanh nghiệp đặt trụ sở","Chỉ thực hiện trực tiếp tại bộ phận một cửa","Chỉ thực hiện đối với doanh nghiệp lớn"],"e":"Mục III.2.1: triển khai mạnh mẽ dịch vụ công không phụ thuộc vào địa giới hành chính. Doanh nghiệp có thể nộp hồ sơ, được giải quyết thủ tục thuận tiện, không bị ràng buộc bởi nơi đặt trụ sở hay ranh giới hành chính.\nĐiều này gắn với yêu cầu chuyển đổi số, chuyển từ quản lý sang phục vụ.\nVì sao các phương án còn lại chưa đúng: Chỉ làm tại nơi đặt trụ sở, chỉ tại bộ phận một cửa hay chỉ cho doanh nghiệp lớn đều đi ngược yêu cầu thuận tiện, bình đẳng với mọi doanh nghiệp.","t":""},{"s":"C","y":"NH","r":"NQ 68-NQ/TW · Mục III.2.1","q":"Nghị quyết yêu cầu khắc phục tình trạng nào trong thực thi chính sách?","o":["Thiếu nhất quán giữa trung ương và địa phương, giữa các bộ, ngành và giữa các địa phương với nhau","Quá nhiều thống nhất giữa các bộ, ngành","Địa phương không được ban hành quy định nào","Trung ương không giám sát việc thực hiện"],"e":"Mục III.2.1 yêu cầu khắc phục tình trạng thiếu nhất quán trong thực thi chính sách, pháp luật giữa trung ương và địa phương, giữa các bộ, ngành, và giữa các địa phương với nhau.\nVới cấp xã, điều này có nghĩa là áp dụng thống nhất quy định, tránh mỗi nơi hiểu và làm một kiểu gây khó cho doanh nghiệp.\nVì sao các phương án còn lại chưa đúng: \"Quá nhiều thống nhất\" là điều Nghị quyết không phê phán. Việc địa phương không được ban hành quy định hay trung ương không giám sát cũng không phải tình trạng được nêu.","t":""},{"s":"C","y":"NH","r":"NQ 68-NQ/TW · Mục IV.6","q":"Cơ quan nào chủ trì theo dõi, đánh giá kết quả thực hiện Nghị quyết và báo cáo Bộ Chính trị?","o":["Đảng uỷ Chính phủ (phối hợp với các cơ quan liên quan)","Đảng uỷ Quốc hội","Ủy ban Kiểm tra Trung ương","Ban Tổ chức Trung ương"],"e":"Mục IV.6: Đảng uỷ Chính phủ chủ trì, phối hợp với Ban Chính sách, chiến lược Trung ương và Văn phòng Trung ương Đảng theo dõi, đánh giá việc thực hiện Nghị quyết và báo cáo Bộ Chính trị.\nNghị quyết cũng giao Đảng uỷ Chính phủ chỉ đạo xây dựng các cơ chế đặc biệt trình Quốc hội tại kỳ họp thứ 9 (tháng 5/2025).\nVì sao các phương án còn lại chưa đúng: Đảng uỷ Quốc hội, Ủy ban Kiểm tra Trung ương và Ban Tổ chức Trung ương không phải cơ quan chủ trì theo dõi, đánh giá Nghị quyết này theo mục IV.6.","t":""},{"s":"C","y":"NH","r":"NQ 68-NQ/TW · Mục III.8","q":"Về tổ chức Đảng và Đoàn trong doanh nghiệp, Nghị quyết yêu cầu gì?","o":["Có chính sách cụ thể, khả thi xây dựng tổ chức Đoàn Thanh niên Cộng sản Hồ Chí Minh và phát triển Đảng trong doanh nghiệp, doanh nhân","Chấm dứt hoạt động tổ chức Đảng trong doanh nghiệp tư nhân","Chỉ phát triển Đảng trong doanh nghiệp nhà nước","Không có quy định riêng"],"e":"Mục III.8: có chính sách cụ thể, khả thi để xây dựng tổ chức Đoàn Thanh niên Cộng sản Hồ Chí Minh và phát triển Đảng trong doanh nghiệp, doanh nhân.\nĐiều này thể hiện vai trò lãnh đạo của Đảng gắn với khu vực kinh tế tư nhân, không loại trừ hay phân biệt với khu vực kinh tế nhà nước.\nVì sao các phương án còn lại chưa đúng: Chấm dứt tổ chức Đảng trong doanh nghiệp tư nhân, chỉ phát triển trong doanh nghiệp nhà nước hay \"không có quy định riêng\" đều trái với nội dung mục III.8.","t":""},{"s":"D","y":"NH","r":"NQ 68-NQ/TW · Mục III.7","q":"Tình huống: Một hộ kinh doanh ở xã muốn chuyển thành doanh nghiệp nhưng ngại thủ tục kế toán, thuế phức tạp. Theo Nghị quyết 68, địa phương nên hỗ trợ thế nào?","o":["Đơn giản hoá, số hoá chế độ kế toán, thuế; cung cấp miễn phí nền tảng số, phần mềm kế toán dùng chung, tư vấn pháp lý, đào tạo","Yêu cầu chuyển đổi ngay, không hỗ trợ gì thêm","Giữ nguyên hình thức hiện nay, không khuyến khích chuyển đổi","Chỉ hướng dẫn tại trụ sở và thu phí tư vấn"],"e":"Mục III.7 (hỗ trợ doanh nghiệp nhỏ, siêu nhỏ và hộ kinh doanh) yêu cầu số hoá, đơn giản hoá kế toán, thuế, bảo hiểm; cung cấp miễn phí nền tảng số, phần mềm kế toán dùng chung, tư vấn pháp lý và đào tạo; xoá bỏ thuế khoán chậm nhất năm 2026.\nMục tiêu là thu hẹp chênh lệch về quản trị, chế độ tài chính - kế toán để hộ kinh doanh yên tâm chuyển thành doanh nghiệp. Cán bộ cơ sở có thể vận dụng bằng cách hướng dẫn, kết nối các công cụ hỗ trợ này.\nVì sao các phương án còn lại chưa đúng: Ép chuyển đổi, giữ nguyên hiện trạng hay thu phí tư vấn đều trái với yêu cầu hỗ trợ miễn phí và khuyến khích chuyển đổi.","t":""},{"s":"D","y":"NH","r":"NQ 68-NQ/TW · Mục III.2.1","q":"Tình huống: Doanh nghiệp nộp hồ sơ đầy đủ nhưng bị cán bộ kéo dài thời gian, gợi ý “chi thêm” mới giải quyết. Theo Nghị quyết 68, hành vi này phải được xử lý thế nào?","o":["Xử lý nghiêm hành vi tham nhũng, trục lợi cá nhân, nhũng nhiễu của cán bộ, công chức","Coi là thông lệ, doanh nghiệp nên chấp nhận cho nhanh","Chỉ nhắc nhở miệng, không xử lý","Chuyển hồ sơ sang cán bộ khác, không xem xét trách nhiệm"],"e":"Mục III.2.1: xử lý nghiêm hành vi tham nhũng, trục lợi cá nhân, nhũng nhiễu của cán bộ, công chức; đồng thời cán bộ làm đúng quy trình, không tư lợi thì được bảo vệ bằng cơ chế miễn trừ trách nhiệm khi có rủi ro khách quan.\nHai mặt này đi cùng nhau: bảo vệ người làm đúng và xử lý nghiêm người vụ lợi.\nVì sao các phương án còn lại chưa đúng: Coi \"chi thêm\" là thông lệ, nhắc nhở miệng hay chuyển hồ sơ mà không xem xét trách nhiệm đều là buông lỏng, trái yêu cầu xử lý nghiêm.","t":"Cán bộ làm đúng quy trình, không tư lợi thì được bảo vệ bằng cơ chế miễn trừ trách nhiệm khi có rủi ro khách quan."},{"s":"D","y":"NH","r":"NQ 68-NQ/TW · Mục III.8","q":"Tình huống: Doanh nghiệp phản ánh vướng mắc liên quan quy hoạch của tỉnh, vượt thẩm quyền của UBND xã. Cán bộ xã cần làm gì cho đúng tinh thần Nghị quyết?","o":["Chủ động, tận tuỵ giải quyết phần thuộc thẩm quyền và kịp thời báo cáo cấp có thẩm quyền phần vượt thẩm quyền","Từ chối tiếp nhận vì không thuộc thẩm quyền","Hướng dẫn doanh nghiệp tự gửi đơn đến nhiều nơi","Chờ có văn bản chỉ đạo của cấp trên rồi mới xử lý"],"e":"Mục III.8: các cơ quan quản lý chủ động, tận tuỵ giải quyết công việc thuộc thẩm quyền và kịp thời báo cáo cấp có thẩm quyền đối với nội dung vượt thẩm quyền, để doanh nghiệp không bị bỏ lửng.\nVới cán bộ xã, đúng tinh thần là tiếp nhận, giải quyết phần của mình và chủ động chuyển, báo cáo phần vượt thẩm quyền, thay vì từ chối hay chờ chỉ đạo.\nVì sao các phương án còn lại chưa đúng: Từ chối tiếp nhận, để doanh nghiệp tự gửi nhiều nơi hay chờ văn bản chỉ đạo đều là cách làm thụ động, đi ngược yêu cầu chủ động, tận tuỵ.","t":""},{"s":"D","y":"NH","r":"NQ 68-NQ/TW · Mục III.2.1","q":"Tình huống: Một sở ban hành văn bản yêu cầu các đơn vị chỉ mua hàng của doanh nghiệp trong tỉnh, hạn chế doanh nghiệp ngoài tỉnh. Văn bản này có phù hợp với Nghị quyết 68 không?","o":["Không phù hợp: Nghị quyết nghiêm cấm lạm dụng quyết định hành chính, hành vi bảo hộ cục bộ của ngành, địa phương","Phù hợp, vì ưu tiên doanh nghiệp địa phương luôn được khuyến khích","Phù hợp nếu được UBND tỉnh đồng ý","Phù hợp nếu chỉ áp dụng với doanh nghiệp tư nhân"],"e":"Mục III.2.1 nghiêm cấm lạm dụng quyết định hành chính và hành vi bảo hộ cục bộ của ngành, địa phương. Văn bản chỉ cho mua hàng của doanh nghiệp trong tỉnh là một dạng bảo hộ cục bộ, làm méo mó cạnh tranh và trái nguyên tắc đối xử bình đẳng.\nNghị quyết hướng tới thị trường thống nhất, cạnh tranh bình đẳng, không phân biệt theo địa bàn hay thành phần kinh tế.\nVì sao các phương án còn lại chưa đúng: Ưu tiên doanh nghiệp địa phương không phải là lý do để hạn chế doanh nghiệp ngoài tỉnh; ý kiến của UBND tỉnh hay giới hạn đối tượng áp dụng cũng không làm văn bản này phù hợp với Nghị quyết.","t":""},{"s":"D","y":"NH","r":"NQ 68-NQ/TW · Mục III.1","q":"Tình huống: Một nhóm mạng xã hội ở địa phương đăng thông tin sai lệch về một doanh nghiệp, ảnh hưởng đến uy tín và hoạt động của doanh nghiệp đó. Nghị quyết 68 yêu cầu gì?","o":["Nghiêm cấm hành vi nhũng nhiễu, tiêu cực, đưa thông tin sai lệch, không chính xác ảnh hưởng đến doanh nghiệp, doanh nhân","Mọi thông tin về doanh nghiệp được đăng tự do, không cần kiểm chứng","Chỉ doanh nghiệp tự chịu trách nhiệm xử lý","Doanh nghiệp nên ngừng hoạt động đến khi dư luận lắng xuống"],"e":"Mục III.1: nghiêm cấm hành vi nhũng nhiễu, tiêu cực, đưa thông tin sai lệch, không chính xác ảnh hưởng đến doanh nghiệp, doanh nhân. Đồng thời, báo chí, truyền thông cần thông tin khách quan, trung thực, đầy đủ và cổ vũ, lan toả mô hình tốt, cách làm hay.\nTự do thông tin không đồng nghĩa với đăng thông tin sai sự thật gây thiệt hại cho doanh nghiệp.\nVì sao các phương án còn lại chưa đúng: Đăng tự do không kiểm chứng, để doanh nghiệp tự xử lý hay bắt doanh nghiệp ngừng hoạt động đều không phải hướng mà Nghị quyết nêu.","t":"Báo chí, truyền thông cần thông tin khách quan, trung thực, đầy đủ; cổ vũ, lan toả mô hình tốt, cách làm hay."},{"s":"D","y":"NH","r":"NQ 68-NQ/TW · Mục III.3.1","q":"Tình huống: Một xã có trụ sở cũ, nhà đất công không còn sử dụng; doanh nghiệp nhỏ chế biến nông sản muốn thuê làm cơ sở sản xuất. Nghị quyết 68 định hướng thế nào?","o":["Đưa vào khai thác, có chính sách hỗ trợ doanh nghiệp nhỏ và vừa thuê nhà, đất là tài sản công chưa sử dụng hoặc không sử dụng tại địa phương","Để nguyên, không cho doanh nghiệp tư nhân sử dụng tài sản công","Chỉ cho doanh nghiệp nhà nước thuê","Bán ngay cho nhà đầu tư lớn nhất để thu ngân sách"],"e":"Mục III.3.1: hỗ trợ doanh nghiệp nhỏ và vừa thuê nhà, đất là tài sản công chưa sử dụng hoặc không sử dụng tại địa phương. Việc này giúp doanh nghiệp có mặt bằng sản xuất với chi phí hợp lý và tránh lãng phí tài sản công.\nLưu ý: việc thuê, sử dụng tài sản công vẫn phải thực hiện theo quy định của pháp luật.\nVì sao các phương án còn lại chưa đúng: Để nguyên không dùng, chỉ cho doanh nghiệp nhà nước thuê hay bán ngay cho nhà đầu tư lớn đều không phản ánh định hướng hỗ trợ doanh nghiệp nhỏ và vừa.","t":"Việc thuê, sử dụng tài sản công vẫn phải thực hiện theo quy định của pháp luật."},{"s":"D","y":"NH","r":"NQ 68-NQ/TW · Mục III.3.2","q":"Tình huống: Một doanh nghiệp nhỏ ở xã có đơn hàng ổn định nhưng không có đất làm tài sản thế chấp để vay vốn. Hướng tháo gỡ nào phù hợp với Nghị quyết 68?","o":["Cho vay dựa trên phương án kinh doanh, dòng tiền, chuỗi giá trị; xem xét cả động sản, tài sản vô hình, tài sản hình thành trong tương lai, tín chấp; hỗ trợ qua quỹ bảo lãnh tín dụng","Chỉ cho vay khi có tài sản thế chấp là đất","Yêu cầu doanh nghiệp tự huy động vốn từ người thân, bạn bè","Đề nghị doanh nghiệp chờ đến khi đủ tài sản bảo đảm"],"e":"Mục III.3.2: tổ chức tín dụng cho vay dựa trên phương án kinh doanh khả thi, dòng tiền, chuỗi giá trị; xem xét cả động sản, tài sản vô hình, tài sản hình thành trong tương lai và cho vay tín chấp; phát triển quỹ bảo lãnh tín dụng cho doanh nghiệp nhỏ và vừa.\nNghĩa là không chỉ dựa vào tài sản đảm bảo là đất như cách làm truyền thống.\nVì sao các phương án còn lại chưa đúng: Chỉ cho vay khi có thế chấp đất, nhờ người thân hay chờ đủ tài sản bảo đảm đều không tháo gỡ được khó khăn mà Nghị quyết muốn giải quyết.","t":""},{"s":"D","y":"NH","r":"NQ 68-NQ/TW · Mục III.5","q":"Tình huống: Tỉnh có vùng nguyên liệu nông sản lớn với nhiều hộ kinh doanh, doanh nghiệp nhỏ; một doanh nghiệp lớn muốn đầu tư chế biến. Nghị quyết 68 khuyến khích hướng nào?","o":["Doanh nghiệp lớn dẫn dắt chuỗi cung ứng nội địa, liên kết với doanh nghiệp nhỏ và vừa, hộ kinh doanh; hỗ trợ cụm liên kết ngành chế biến nông sản","Doanh nghiệp lớn tự lo nguyên liệu, không cần liên kết với địa phương","Tách riêng doanh nghiệp lớn và các hộ kinh doanh","Hạn chế doanh nghiệp lớn để bảo vệ doanh nghiệp nhỏ"],"e":"Mục III.5: doanh nghiệp lớn dẫn dắt chuỗi cung ứng nội địa, liên kết với doanh nghiệp nhỏ và vừa, hộ kinh doanh; hỗ trợ hình thành các cụm liên kết ngành, trong đó có chế biến nông sản.\nHướng này giúp hộ và doanh nghiệp nhỏ có đầu ra ổn định, còn doanh nghiệp lớn có vùng nguyên liệu và nhà cung ứng tại chỗ.\nVì sao các phương án còn lại chưa đúng: Tách riêng, bỏ qua liên kết hay hạn chế doanh nghiệp lớn đều trái tinh thần liên kết và cùng phát triển của mục III.5.","t":""},{"s":"D","y":"NH","r":"NQ 68-NQ/TW · Mục III.5","q":"Tình huống: Tỉnh chuẩn bị phê duyệt một dự án FDI lớn trong khu công nghiệp. Theo Nghị quyết 68, cần đặt vấn đề gì ngay từ giai đoạn phê duyệt?","o":["Dự án FDI lớn phải có kế hoạch sử dụng chuỗi cung ứng nội địa","Chỉ cần vốn đầu tư lớn, không cần liên kết doanh nghiệp trong nước","Toàn bộ mua sắm phải thực hiện với doanh nghiệp nhà nước","Dự án không được sử dụng nhân lực tại địa phương"],"e":"Mục III.5: dự án FDI lớn phải có kế hoạch sử dụng chuỗi cung ứng nội địa ngay từ giai đoạn phê duyệt; Nhà nước hỗ trợ tư vấn, xúc tiến thương mại để kết nối doanh nghiệp FDI với doanh nghiệp nội địa tại các khu công nghiệp.\nMục tiêu là để doanh nghiệp trong nước tham gia chuỗi giá trị, tăng giá trị gia tăng và lan toả công nghệ.\nVì sao các phương án còn lại chưa đúng: Chỉ cần vốn lớn, mua sắm toàn bộ với doanh nghiệp nhà nước hay cấm dùng nhân lực địa phương đều không có trong Nghị quyết.","t":"Nhà nước hỗ trợ tư vấn, xúc tiến thương mại để kết nối doanh nghiệp FDI với doanh nghiệp nội địa tại các khu công nghiệp."},{"s":"D","y":"NH","r":"NQ 68-NQ/TW · Mục III.2.3","q":"Tình huống: Trong một vụ việc liên quan đến doanh nghiệp, cơ quan có thẩm quyền ở tỉnh dự kiến phong toả toàn bộ tài sản, lớn hơn nhiều so với thiệt hại dự kiến. Nghị quyết 68 yêu cầu gì?","o":["Niêm phong, kê biên, tạm giữ, phong toả phải đúng thẩm quyền, trình tự, thủ tục, phạm vi và tương ứng với dự kiến hậu quả thiệt hại","Được phong toả toàn bộ để chắc chắn thu hồi","Chỉ cần ý kiến của cấp trên là đủ","Không cần xét ảnh hưởng đến hoạt động sản xuất, kinh doanh"],"e":"Mục III.2.3: việc niêm phong, kê biên, tạm giữ, phong toả phải đúng thẩm quyền, trình tự, thủ tục, phạm vi và tương ứng với dự kiến hậu quả thiệt hại. Tính tương xứng là điểm mấu chốt: không phong toả lớn hơn mức cần thiết.\nNghị quyết vẫn cho phép áp dụng hợp lý các biện pháp cần thiết để bảo đảm giá trị tài sản, đồng thời giảm thiểu tác động đến hoạt động sản xuất, kinh doanh.\nVì sao các phương án còn lại chưa đúng: Phong toả toàn bộ để chắc chắn, chỉ cần ý kiến cấp trên, hay không xét ảnh hưởng đến sản xuất đều thiếu căn cứ về thẩm quyền, trình tự và tính tương xứng.","t":"Cho phép áp dụng hợp lý các biện pháp cần thiết để bảo đảm giá trị tài sản, đồng thời giảm thiểu tác động đến hoạt động sản xuất - kinh doanh."},{"s":"D","y":"NH","r":"NQ 68-NQ/TW · Mục III.3.1","q":"Tình huống: Doanh nghiệp xin thuê đất ở một xã nhưng không tìm được thông tin quy hoạch, hồ sơ giải quyết kéo dài. Nghị quyết 68 yêu cầu địa phương làm gì?","o":["Công khai, minh bạch, chủ động cung cấp thông tin đất đai; giảm thời gian giải quyết thủ tục thuê đất, cấp giấy chứng nhận quyền sử dụng đất; hỗ trợ giải phóng mặt bằng","Chỉ cung cấp thông tin khi doanh nghiệp có quan hệ quen biết","Yêu cầu doanh nghiệp tự giải phóng mặt bằng, địa phương không hỗ trợ","Tạm dừng nhận hồ sơ đến khi hoàn thành quy hoạch mới"],"e":"Mục III.3.1: xây dựng cơ sở dữ liệu đất đai (hoàn thành trong năm 2025), công khai, minh bạch thông tin; giảm thời gian giải quyết thủ tục thuê đất, cấp giấy chứng nhận quyền sử dụng đất; hỗ trợ giải phóng mặt bằng cho doanh nghiệp.\nTiếp cận đất đai và thông tin quy hoạch là điểm nghẽn thường gặp của doanh nghiệp nhỏ; công khai, minh bạch giúp doanh nghiệp chủ động và hạn chế tiêu cực.\nVì sao các phương án còn lại chưa đúng: Chỉ cung cấp thông tin theo quan hệ quen biết, không hỗ trợ giải phóng mặt bằng hay tạm dừng nhận hồ sơ đều đi ngược yêu cầu minh bạch và phục vụ.","t":""},{"s":"D","y":"NH","r":"NQ 68-NQ/TW · Mục III.4","q":"Tình huống: Một doanh nghiệp nhỏ ở tỉnh muốn thử nghiệm, kiểm định sản phẩm mới nhưng không đủ kinh phí xây phòng thí nghiệm riêng. Nghị quyết 68 cho phép gì?","o":["Được sử dụng phòng thí nghiệm, phòng thử nghiệm, thiết bị nghiên cứu dùng chung, trung tâm thử nghiệm, đo lường, kiểm định của Nhà nước với mức phí hợp lý","Chỉ doanh nghiệp nhà nước được dùng cơ sở thử nghiệm của Nhà nước","Được dùng miễn phí hoàn toàn mọi cơ sở của Nhà nước","Phải tự đầu tư phòng thí nghiệm mới được cấp phép sản xuất"],"e":"Mục III.4: doanh nghiệp được sử dụng phòng thí nghiệm, phòng thử nghiệm, thiết bị nghiên cứu dùng chung, trung tâm thử nghiệm, đo lường, kiểm định của Nhà nước với mức phí hợp lý.\nChữ then chốt là \"mức phí hợp lý\": không phải miễn phí hoàn toàn và không chỉ dành riêng cho doanh nghiệp nhà nước. Điều này giúp doanh nghiệp nhỏ đổi mới sáng tạo mà không phải tự đầu tư cơ sở vật chất tốn kém.\nVì sao các phương án còn lại chưa đúng: Chỉ doanh nghiệp nhà nước được dùng, miễn phí hoàn toàn mọi cơ sở, hay bắt phải tự xây phòng thí nghiệm đều không đúng nội dung mục III.4.","t":""}]};

function readProg(m){var raw=ls(pk(m));if(!raw)return null;try{var d=JSON.parse(raw);if(!d||d.v!==1||!Array.isArray(d.idx)||!d.idx.length||d.idx.length!==d.p.length)return null;
 for(var n=0;n<d.idx.length;n++){var b=BANK[d.idx[n]];if(!b||!Array.isArray(d.p[n])||d.p[n].length!==b.o.length)return null;if(d.p[n].slice().sort(function(x,y){return x-y}).join()!==b.o.map(function(_,k){return k}).join())return null}
 var ans={};Object.keys(d.ans||{}).forEach(function(k){var v=d.ans[k];if(+k>=0&&+k<d.idx.length&&v>=0&&v<d.p[+k].length)ans[k]=v});
 d.ans=ans;d.flag=d.flag||{};d.cur=Math.min(Math.max(+d.cur||0,0),d.idx.length-1);d.el=Math.max(0,+d.el||0);d.mode=m==='exam'?'exam':'learn';return d}catch(e){return null}}

}
function compute(){
 var n=S.qs.length,c=0,bl=0,th={},ty={};
 S.qs.forEach(function(q,k){var a=S.ans[k],ok=a!==undefined&&q.opts[a].ok;if(a===undefined)bl++;if(ok)c++;
  [[th,q.b.s],[ty,q.b.y]].forEach(function(p){var m=p[0],key=p[1];m[key]=m[key]||{n:0,c:0};m[key].n++;if(ok)m[key].c++})});
 return {n:n,c:c,bl:bl,wr:n-c-bl,score:Math.round(c*1000/n)/100,th:th,ty:ty};
}
function commentary(r){
 var out=[],weak=[],bestK=null,bp=-1;
 Object.keys(r.th).forEach(function(k){var p=pct(r.th[k].c,r.th[k].n);if(p<70)weak.push(THEMES[k].t+' ('+THEMES[k].d+')');if(p>bp){bp=p;bestK=k}});
 if(r.c===r.n)out.push('Bạn trả lời đúng toàn bộ các tình huống.');
 if(bestK&&bp>=70)out.push('Nhóm làm tốt nhất: '+THEMES[bestK].t+' ('+bp+'%).');
 if(weak.length)out.push('Nên ôn lại: '+weak.join('; ')+'.');
 if(r.ty.RG&&pct(r.ty.RG.c,r.ty.RG.n)<60)out.push('Bạn còn nhầm ở các câu phân biệt ranh giới giữa việc được làm và không được làm: hãy đọc kỹ từng lựa chọn và dòng “Cần nhớ”.');
 if(r.bl)out.push('Còn '+r.bl+' câu chưa trả lời.');
 return out;
}

   dis=' disabled';

  } else if(a===j)cls+=' sel';
  var mark=(mode2==='review'||(S.mode==='learn'&&a!==undefined))?(o.ok?' ✓':(a===j?' ✗':'')):'';

 });

function statsComment(d){
 var o=[],weak=[],bestK=null,bp=-1;
 Object.keys(THEMES).forEach(function(k){var m=d.th[k];if(!m||!m.n)return;var p=pct(m.c,m.n);if(p<70)weak.push({t:THEMES[k].t+' ('+p+'% câu đúng)',p:p});if(p>bp){bp=p;bestK=k}});
 if(d.completions<5)o.push('Mới có '+d.completions+' lượt làm đủ bài, số liệu còn ít nên chỉ mang tính tham khảo.');
 if(d.completions){o.push('Điểm trung bình '+fmt(d.avg*10)+'/100; '+d.pass+'% lượt làm bài đạt từ 50 điểm trở lên.');}
 if(bestK&&bp>=70)o.push('Nhóm nội dung nắm tốt nhất: '+THEMES[bestK].t+' ('+bp+'% câu đúng).');
 if(weak.length){weak.sort(function(x,y){return x.p-y.p});o.push('Nhóm cần tăng cường tuyên truyền, ôn tập (thấp nhất trước): '+weak.map(function(w){return w.t}).join('; ')+'.')}
 var rg=d.ty&&d.ty.RG;if(rg&&rg.n&&pct(rg.c,rg.n)<60)o.push('Các câu phân biệt ranh giới (được làm/không được làm) còn nhiều người nhầm ('+pct(rg.c,rg.n)+'% đúng).');
 return o;
}
function viewStats(){
 var h='<div class="bar"><div class="wrap"><button class="tbtn" data-act="home" aria-label="Về trang đầu">⌂</button><div class="mid"><b>Thống kê chung</b></div>'+sbtn()+tbtn()+'<button class="btn sm" data-act="stats">Làm mới</button></div></div><div class="wrap" style="padding-top:18px;padding-bottom:40px">';
 if(S.loading)return h+'<div class="card">Đang tải số liệu…</div></div>';
 if(S.err)return h+'<div class="note">Chưa tải được số liệu thống kê. Kiểm tra kết nối mạng rồi bấm “Làm mới”.<br><small>Chi tiết: '+esc(S.why||'')+'</small></div></div>';
 var d=S.st;
 h+='<div class="bigstat"><div class="stat"><b>'+d.visitors+'</b><small>người đã truy cập</small></div><div class="stat"><b>'+d.participants+'</b><small>người đã làm bài</small></div><div class="stat"><b>'+d.completions+'</b><small>lượt làm đủ bộ câu hỏi</small></div><div class="stat"><b>'+(d.completions?fmt(d.avg*10):'–')+'</b><small>điểm trung bình</small></div><div class="stat"><b>'+(d.completions?d.pass+'%':'–')+'</b><small>lượt đạt (từ 50 điểm)</small></div><div class="stat"><b>'+(d.completions?mmss(d.avgSecs):'–')+'</b><small>thời gian làm TB</small></div></div>';
 if(!d.completions)return h+'<div class="note">Chưa có ai làm đủ bài. Khi có kết quả, phần phân tích sẽ hiện ở đây.</div></div>';
 var cm=statsComment(d);if(cm.length)h+='<div class="comments">'+cm.map(function(c){return '<p>'+esc(c)+'</p>'}).join('')+'</div>';
 h+='<div class="card"><div class="sec-t">Phân bố xếp loại</div><div class="meters">';
 GRADES.forEach(function(g){var c=d.grades[g.name]||0,p=pct(c,d.completions);h+='<div class="l-mid"><div class="meter-top"><b>'+esc(g.name)+'</b><span>'+c+' lượt · '+p+'%</span></div><div class="mbar"><i data-w="'+p+'"></i></div></div>'});
 h+='</div><div class="sec-t" style="margin-top:20px">Tỷ lệ trả lời đúng theo nhóm nội dung</div><div class="meters">';
 Object.keys(THEMES).forEach(function(k){var m=d.th[k];if(!m||!m.n)return;var p=pct(m.c,m.n),l=lvl(p);h+='<div class="'+l[0]+'"><div class="meter-top"><b>'+esc(THEMES[k].t)+'</b><span>'+p+'% · '+l[1]+'</span></div><div class="mbar"><i data-w="'+p+'"></i></div></div>'});
 h+='</div><div class="meters">';
 Object.keys(TYPES).forEach(function(k){var m=d.ty[k];if(!m||!m.n)return;var p=pct(m.c,m.n),l=lvl(p);h+='<div class="'+l[0]+'"><div class="meter-top"><b>'+esc(TYPES[k])+'</b><span>'+p+'% · '+l[1]+'</span></div><div class="mbar"><i data-w="'+p+'"></i></div></div>'});
 h+='</div></div>';
 var qs=(d.q||[]).filter(function(x){return x.n>=1}).map(function(x){return {i:x.i,p:pct(x.c,x.n),n:x.n}}).sort(function(a,b){return a.p-b.p||b.n-a.n}).slice(0,8);
 if(qs.length){h+='<div class="sec"><div class="sec-t">Những câu nhiều người trả lời sai nhất</div><ul class="hq">';qs.forEach(function(x){var b=BANK[x.i];if(!b)return;h+='<li><b>'+x.p+'% đúng</b> · '+esc(b.r)+' — '+esc(b.q)+'<br><span style="color:var(--muted)">'+esc(b.e)+'</span></li>'});h+='</ul></div>'}
 h+='<p class="best">Số liệu ẩn danh, cập nhật lúc '+esc(new Date(d.updated).toLocaleString('vi-VN'))+'.</p></div>';
 return h;
}
function render_(){
 var h=S===null||S.view==='start'?viewStart():S.view==='quiz'?viewQuiz():S.view==='stats'?viewStats():viewResult();
 app.innerHTML=h;
 if(S&&S.view==='stats'){setTimeout(function(){var ms=document.querySelectorAll('.mbar i');for(var i=0;i<ms.length;i++)ms[i].style.width=ms[i].getAttribute('data-w')+'%'},30)}
 if(S&&S.view==='result'){
  var r=S.res,fg=document.getElementById('rfg'),rn=document.getElementById('rn');
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(function(){if(fg)fg.style.strokeDashoffset=String(326.7*(1-r.score/10));var ms=document.querySelectorAll('.mbar i');for(var i=0;i<ms.length;i++)ms[i].style.width=ms[i].getAttribute('data-w')+'%'},30);
  if(reduce){rn.textContent=pt(r.score*10)}else{var t0=performance.now();(function step(t){var p=Math.min(1,(t-t0)/1000);rn.textContent=pt(r.score*10*p);if(p<1)requestAnimationFrame(step);else rn.textContent=pt(r.score*10)})(t0)}
 }
}
function finish(){
 clearInterval(timer);S.el=Math.floor((Date.now()-S.t0)/1000);S.res=compute();S.view='result';S.confirm=false;clearProg(S.mode);
 if(S.qs.length===BANK.length){var g=gradeOf(S.res.score);if(!best||S.res.score>best.s){best={s:S.res.score,g:g.name};ls('qdnq68_best',JSON.stringify(best))}}
 if(S.qs.length===BANK.length&&ENDPOINT){var th={},ty={};['th','ty'].forEach(function(w){var src=S.res[w],dst=w==='th'?th:ty;Object.keys(src).forEach(function(k){dst[k]=[src[k].c,src[k].n]})});
  send({t:'result',v:2,mode:S.mode,score:S.res.score,c:S.res.c,n:S.res.n,secs:S.el,q:S.qs.map(function(q,k){var a=S.ans[k];return [q.i,a===undefined?-1:(q.opts[a].ok?1:0)]}),th:th,ty:ty});S.sent=true}
 sfx(S.res.score>=5?'win':'end');render();window.scrollTo(0,0);
}
function pick(j){
 var k=S.cur;if(S.mode==='learn'&&S.ans[k]!==undefined)return;
 if(S.mode==='exam'&&S.ans[k]===j){delete S.ans[k];sfx('tick')}else{S.ans[k]=j;sfx(S.mode==='learn'?(S.qs[k].opts[j].ok?'ok':'bad'):'tick')}
 render();
}
function goto(i){if(i<0||i>=S.qs.length)return;S.cur=i;render();window.scrollTo(0,0)}
app.addEventListener('click',function(e){
 var el=e.target.closest('[data-act]');if(!el)return;var a=el.getAttribute('data-act');
 if(a==='snd')return toggleSnd();
 if(a==='theme')return toggleTheme();
 if(a==='mode'){mode=el.getAttribute('data-m');askRestart=false;return render()}
 if(a==='rs_no'){askRestart=false;return render()}
 if(a==='rs_ok'){askRestart=false;clearProg(mode);return newSession(mode,BANK.map(function(_,i){return i}))}
 if(a==='stats')return loadStats();
 if(a==='resume'){var rd=readProg(mode);if(!rd){S=null;return render()}return newSession(rd.mode,rd.idx,rd)}
 if(a==='start'&&readProg(mode)){askRestart=true;return render()}
 if(a==='start')return newSession(mode,BANK.map(function(_,i){return i}));
 if(a==='home'){if(S&&S.view==='quiz')saveProg();clearInterval(timer);S=null;render();return window.scrollTo(0,0)}
 if(!S)return;
 if(a==='opt')return pick(+el.getAttribute('data-j'));
 if(a==='go')return goto(+el.getAttribute('data-i'));
 if(a==='prev')return goto(S.cur-1);
 if(a==='next'){if(S.cur===S.qs.length-1){S.confirm=true;return render()}return goto(S.cur+1)}
 if(a==='flag'){S.flag[S.cur]=!S.flag[S.cur];return render()}
 if(a==='submit'){S.confirm=true;return render()}
 if(a==='cancel'){S.confirm=false;return render()}
 if(a==='confirm')return finish();
 if(a==='filter'){S.filter=el.getAttribute('data-f');return render()}
 if(a==='again')return newSession(S.mode,BANK.map(function(_,i){return i}));
 if(a==='redo'){var idx=[];S.qs.forEach(function(q,k){var x=S.ans[k];if(!(x!==undefined&&q.opts[x].ok))idx.push(q.i)});return newSession('learn',idx)}
});
document.addEventListener('keydown',function(e){
 if(!S||S.view!=='quiz'||e.ctrlKey||e.metaKey||e.altKey)return;
 var k=e.key.toLowerCase();
 if(k.length===1){var j='abcd'.indexOf(k);if(j<0)j='1234'.indexOf(k);if(j>=0&&j<S.qs[S.cur].opts.length&&!S.confirm){pick(j)}return}
 if(S.confirm)return;
 if(k==='arrowright')goto(S.cur+1);else if(k==='arrowleft')goto(S.cur-1);else if(k==='enter'&&S.mode==='learn'&&S.ans[S.cur]!==undefined&&S.cur<S.qs.length-1)goto(S.cur+1);
});
function flush(){if(S&&S.view==='quiz'){S.el=Math.floor((Date.now()-S.t0)/1000);saveProg()}}
document.addEventListener('visibilitychange',function(){if(document.hidden)flush()});window.addEventListener('pagehide',flush);
theme();pingVisit();
var bt=document.getElementById('boot');if(bt)bt.parentNode.removeChild(bt);
render();
})();
</script>
</body>
</html>
